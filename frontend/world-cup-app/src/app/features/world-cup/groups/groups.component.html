<div class="fase-grupos-container">
  
  <div class="grupos-grid">
    
    <div *ngFor="let grupo of misGrupos" class="panel-card">
      
      <div class="panel-header">
        <h3>Grupo {{ grupo.groupName }}</h3>
      </div>
      
      <div class="panel-body">
        <table class="tabla-posiciones">
          <thead>
            <tr>
              <th>POS</th>
              <th>EQUIPO</th>
              <th>PJ</th>
              <th>PG</th>
              <th>PE</th>
              <th>PP</th>
              <th>PTS</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let team of grupo.teams; let i = index" [class.my-team-highlight]="team.isMyTeam">
              <td>{{ i + 1 }}</td>
              <td class="team-name">
                {{ team.teamName }} <span class="team-code">[{{ team.teamId | uppercase }}]</span>
                <span *ngIf="team.isMyTeam" class="my-team-label"> (Mi Equipo)</span>
              </td>
              <td>{{ team.played }}</td>
              <td>{{ team.wins }}</td>
              <td>{{ team.draws }}</td>
              <td>{{ team.losses }}</td>
              <td class="team-points">{{ team.points }}</td>
            </tr>
          </tbody>
        </table>
      </div>

    </div> </div> </div>
