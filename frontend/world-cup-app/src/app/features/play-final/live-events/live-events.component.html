<section class="card">
  <div class="card-header">
    <span class="card-title">Eventos en vivo</span>
  </div>
  <p>Aca veremos lo mejor del partido</p>
</section>
<div
  style="
    padding: 15px;
    font-family: sans-serif;
    background-color: #ffffff;
    margin-top: 20px;
    border-top: 2px dashed #000000;
  "
>
  <h3 style="color: #ff0000; margin-top: 0; padding-bottom: 5px">
    Eventos en vivo
  </h3>
  <div
    *ngIf="eventosEnVivo.length === 0"
    style="
      background-color: #eeeeee;
      color: #000000;
      padding: 10px;
      font-style: italic;
    "
  >
    Buscando los eventos en el servidor...
  </div>

  <div
    *ngFor="let unEvento of eventosEnVivo"
    style="
      background-color: #f4f4f4;
      border-left: 6px solid #ff0000;
      margin-top: 10px;
      margin-bottom: 10px;
      padding: 10px;
    "
  >
    <strong style="color: #000000">Minuto {{ unEvento.minuto }}' - </strong>

    <span
      style="
        background-color: #000000;
        color: #ffffff;
        padding-left: 5px;
        padding-right: 5px;
        font-weight: bold;
        margin-right: 5px;
      "
    >
      {{ unEvento }}
    </span>
    <span style="color: #333333"> Accion en vivo </span>
  </div>

  <h2
    style="
      color: #ff0000;
      border-bottom: 3px solid #000000;
      padding-bottom: 5px;
    "
  >
    Eventos en Vivo
  </h2>
</div>
